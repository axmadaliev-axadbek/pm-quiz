<meta charset="utf-8">

<title>Тренажёр - Темы 1 и 2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600;700&display=swap');

:root{
  --ink:#101736;
  --paper:#EDEFF6;
  --card:#FFFFFF;
  --line:#DDE1EE;
  --blue:#2D4BAC;
  --blue-soft:#E7EBF9;
  --ok:#0E9384;
  --ok-soft:#DFF3F0;
  --no:#D6455D;
  --no-soft:#FBE6EA;
  --mute:#6B7392;
  --r:14px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}

.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}

/* ---------- ribbon ---------- */
.ribbon-hold{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  padding:14px 16px 10px;
  margin:0 -16px;
}
.back{
  display:block;padding:0 0 10px;font-size:12.5px;font-weight:600;
  color:var(--mute);letter-spacing:.02em;
}
.back:active{color:var(--blue)}
.ribbon{display:flex;gap:2px;align-items:flex-end;height:14px}
.tick{
  flex:1;height:5px;border-radius:2px;background:var(--line);
  transition:height .18s ease,background .18s ease;
}
.tick.ok{background:var(--ok)}
.tick.no{background:var(--no)}
.tick.now{height:14px;background:var(--blue)}
.ribbon-meta{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);font-weight:600;
}
.ribbon-meta b{color:var(--ink);font-weight:600}

/* ---------- type ---------- */
.display{font-family:'Unbounded',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);font-weight:600}

/* ---------- start ---------- */
.hero{padding:36px 0 8px}
.hero h1{margin:14px 0 0;font-size:32px}
.hero h1 span{display:block;color:var(--blue)}
.hero p{color:var(--mute);margin:14px 0 0;font-size:15px}

.picks{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.pick{
  display:flex;align-items:flex-start;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;text-align:left;width:100%;
  transition:border-color .15s,transform .1s;
}
.pick .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.restart{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  color:var(--mute);font-size:15px;line-height:1;display:flex;
  align-items:center;justify-content:center;background:var(--paper);
}
.restart:active{color:var(--blue);border-color:var(--blue)}
.stat{display:block;margin-top:10px}
.sbar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line)}
.sbar i{display:block;height:100%}
.sbar i.ok{background:var(--ok)}
.sbar i.no{background:var(--no)}
.sline{display:block;margin-top:6px;font-size:11.5px;color:var(--mute);font-weight:400}
.sline b{color:var(--ink);font-weight:600}
.warn{
  margin-top:16px;padding:14px 16px;border-radius:var(--r);
  background:var(--no-soft);border:1px solid #F2BFC8;font-size:13.5px;line-height:1.5;
}
.warn b{display:block;margin-bottom:6px;color:var(--no)}
.migbox{display:none;margin-top:8px;padding:16px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r)}
.migbox.open{display:block}
.migl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);
  font-weight:600;margin-bottom:7px}
.migbox textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-family:inherit;font-size:12px;color:var(--ink);background:var(--paper);
  resize:none;line-height:1.4;margin-bottom:8px;word-break:break-all;
}
.migmsg{margin-top:10px;font-size:12.5px;color:var(--blue);font-weight:600}
.where{
  text-align:center;margin-top:18px;font-size:11px;color:var(--mute);
  letter-spacing:.05em;opacity:.75;
}
.reset{display:block;margin:14px auto 0;font-size:12.5px;color:var(--mute);padding:8px 12px}
.reset:active{color:var(--no)}
.pick:active{transform:scale(.99)}
.pick .n{
  font-family:'Unbounded',sans-serif;font-weight:800;font-size:20px;
  color:var(--blue);min-width:28px;
}
.pick .t{font-weight:600;flex:1}
.pick .t em{
  display:block;font-style:normal;font-weight:400;font-size:12.5px;
  color:var(--mute);margin-top:3px;line-height:1.35;
}
.pick .c{font-size:12px;color:var(--mute);letter-spacing:.04em}
.resume{
  margin-top:18px;padding:14px 16px;border-radius:var(--r);
  background:var(--blue-soft);border:1px solid #CBD5F2;font-size:14px;
}
.resume b{display:block;margin-bottom:8px}
.resume-btns{display:flex;gap:8px;margin-top:4px}
.mini{
  padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--blue);color:#fff;
}
.mini.ghost{background:transparent;color:var(--blue);border:1px solid #B9C5EC}

/* ---------- question ---------- */
.qhead{margin:22px 0 0}
.qnum{
  font-family:'Unbounded',sans-serif;font-weight:400;font-size:12px;
  color:var(--mute);letter-spacing:.06em;
}
.qtext{font-size:20px;font-weight:600;line-height:1.35;margin:10px 0 4px;letter-spacing:-.01em}
.qhint{font-size:12.5px;color:var(--blue);font-weight:600;margin-top:8px}

.opts{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;line-height:1.4;
  transition:border-color .15s,background .15s,transform .08s;
}
.opt:active{transform:scale(.995)}
.opt .box{
  flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid #C3C9DC;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  font-size:12px;font-weight:700;color:#fff;transition:all .15s;
}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .box{background:var(--blue);border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .box{background:var(--ok);border-color:var(--ok)}
.opt.no{border-color:var(--no);background:var(--no-soft)}
.opt.no .box{background:var(--no);border-color:var(--no)}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}

.verdict{
  margin-top:16px;border-radius:var(--r);padding:15px 17px;
  border:1px solid;font-size:14.5px;line-height:1.5;
}
.verdict.ok{background:var(--ok-soft);border-color:#A9DED7}
.verdict.no{background:var(--no-soft);border-color:#F2BFC8}
.verdict .lab{
  font-family:'Unbounded',sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:7px;
}
.verdict.ok .lab{color:var(--ok)}
.verdict.no .lab{color:var(--no)}

/* ---------- bottom bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 62%,rgba(237,239,246,0));
}
.bar-in{max-width:560px;margin:0 auto}
.go{
  width:100%;padding:16px;border-radius:var(--r);
  background:var(--blue);color:#fff;font-weight:600;font-size:16px;
  box-shadow:0 6px 18px rgba(45,75,172,.24);
  transition:transform .1s,opacity .15s;
}
.go:active{transform:scale(.99)}
.go[disabled]{opacity:.4;box-shadow:none}
.go.dark{background:var(--ink);box-shadow:0 6px 18px rgba(16,23,54,.2)}

/* ---------- result ---------- */
.score{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;margin-top:22px;text-align:center;
}
.score .big{font-family:'Unbounded',sans-serif;font-weight:800;font-size:46px;line-height:1;letter-spacing:-.03em}
.score .of{color:var(--mute);font-size:14px;margin-top:8px}
.score .pct{
  display:inline-block;margin-top:14px;padding:5px 13px;border-radius:99px;
  font-size:12.5px;font-weight:600;background:var(--blue-soft);color:var(--blue);
}

.grouphead{
  display:flex;align-items:baseline;gap:9px;margin:30px 0 12px;
}
.grouphead h2{font-family:'Unbounded',sans-serif;font-weight:600;font-size:15px;margin:0;letter-spacing:-.01em}
.grouphead .cnt{
  font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;
}
.cnt.no{background:var(--no-soft);color:var(--no)}
.cnt.ok{background:var(--ok-soft);color:var(--ok)}

.item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden;
}
.item-top{
  display:flex;gap:12px;padding:14px 16px;width:100%;text-align:left;align-items:flex-start;
}
.item-top .mark{
  flex:none;width:20px;height:20px;border-radius:6px;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;margin-top:1px;
}
.mark.no{background:var(--no)}
.mark.ok{background:var(--ok)}
.item-top .qt{flex:1;font-size:14.5px;font-weight:500;line-height:1.4}
.item-top .chev{color:var(--mute);font-size:12px;margin-top:3px;transition:transform .2s}
.item.open .chev{transform:rotate(180deg)}
.item-body{display:none;padding:0 16px 16px;font-size:14px}
.item.open .item-body{display:block}
.row{margin-top:10px;padding-left:12px;border-left:2px solid var(--line)}
.row .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.row.bad{border-color:var(--no)}
.row.good{border-color:var(--ok)}
.row .v{margin-top:3px;line-height:1.45}
.why{margin-top:12px;padding:12px 14px;background:var(--paper);border-radius:10px;line-height:1.5;font-size:13.5px}

.endbtns{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.empty{color:var(--mute);font-size:14px;padding:4px 2px}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
.fade{animation:f .22s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<div class="wrap" id="app"></div>
<div class="bar" id="bar" style="display:none"><div class="bar-in" id="barin"></div></div>

<script>
const BANK = [
// ===================== ТЕМА 1 =====================
{t:1,type:"single",q:"Что из перечисленного - продукт, а не проект?",o:["Добавить push-уведомления в приложение","Мобильный банк, который развивается пятый год","Лендинг под трёхмесячную акцию","Миграция базы данных на новый сервер"],c:1,
why:"Продукт развивается бессрочно и не завершается, только меняется. Проект имеет фиксированный срок и конкретный результат. Остальные три варианта - это отдельные проекты внутри развития продукта."},

{t:1,type:"single",q:"Главная причина провала стартапов по данным CB Insights:",o:["Закончились деньги","Плохая команда","Продукт оказался никому не нужен","Действия конкурентов"],c:2,
why:"42% стартапов проваливаются потому, что построили продукт, который не решает реальную проблему. Можно нанять лучших разработчиков и привлечь инвестиции - и всё равно провалиться, если изначально неверно понял, что нужно людям."},

{t:1,type:"multi",q:"Какие три свойства добавляет слово «цифровой» к слову «продукт»?",o:["Не нужно физически передавать","Всегда бесплатен на старте","Можно обновлять без физического участия","Масштабируется без пропорционального роста затрат","Обязательно есть мобильное приложение"],c:[0,2,3],
why:"Именно эти три свойства объясняют, почему одно приложение может обслуживать и 10, и 10 миллионов пользователей на одной кодовой базе. Монетизация и наличие мобильной версии к определению не относятся."},

{t:1,type:"single",q:"Компания сделала админку для собственной службы поддержки: 40 сотрудников, обновляется раз в месяц. Что это?",o:["Не продукт, просто внутренний инструмент","Цифровой продукт, B2B","Цифровой продукт, внутренний","Проект, а не продукт"],c:2,
why:"Решает реальную повторяющуюся задачу, работает постоянно, обновляется - это продукт. По типу аудитории он внутренний: сделан для сотрудников конкретной компании, а не продаётся другим бизнесам."},

{t:1,type:"single",q:"Продукт запущен, 1200 пользователей, команда тестирует три модели монетизации и пытается понять, кто возвращается. Этап жизненного цикла:",o:["До запуска","MVP","Рост","Стабилизация"],c:1,
why:"MVP - продукт уже в рынке, но бизнес-модель ещё не найдена. Классические признаки: первые данные есть, идут эксперименты с монетизацией и поиск реального пользователя."},

{t:1,type:"single",q:"У продукта 3 млн пользователей, стабильная выручка, фокус команды - удержание и выход в новые ниши. Этап:",o:["MVP","Рост","Стабилизация","До запуска"],c:2,
why:"Стабилизация: зрелая аудитория, устойчивая выручка, фокус смещён с привлечения новых пользователей на удержание существующих и поиск новых возможностей."},

{t:1,type:"single",q:"Три области, на стыке которых работает продакт:",o:["Дизайн, разработка, маркетинг","Пользователи, бизнес, технологии","Аналитика, продажи, поддержка","Стратегия, метрики, бэклог"],c:1,
why:"Customer / business / technology. Продакт не самый глубокий эксперт ни в одной из них, но единственный, кто видит всю картину целиком."},

{t:1,type:"single",q:"Что НЕ входит в зону ответственности продакта?",o:["Решить, какую проблему решать следующей","Написать код новой фичи","Приоритизировать бэклог","Объяснить поддержке, что изменилось в продукте"],c:1,
why:"Продакт отвечает за «что», а не за «как». Реализацию выбирают разработчики, дизайнеры и аналитики."},

{t:1,type:"single",q:"Продакту прилетели три запроса одновременно: баг от поддержки, фича от CEO, улучшение онбординга от аналитика. Что он делает первым?",o:["Берёт запрос CEO - он главный стейкхолдер","Чинит баг, поддержка ждёт","Оценивает влияние каждого на метрики и приоритизирует","Запускает всё параллельно"],c:2,
why:"Приоритизация идёт через влияние на метрики и пользователей, а не через срочность или статус того, кто попросил. Сначала оценка, потом решение."},

{t:1,type:"single",q:"Сколько минимум рабочего времени продакт тратит на коммуникацию?",o:["Около 10%","Около 30%","Не менее 50%","Зависит от уровня, джун почти не коммуницирует"],c:2,
why:"Не менее половины времени. Чем выше уровень продакта, тем больше эта доля: он больше координирует и синхронизирует, чем делает руками."},

{t:1,type:"single",q:"CAC вырос с $2 до $5 при том же объёме привлечения. Какой hard skill нужен, чтобы понять последствия для продукта?",o:["Продуктовый дизайн","Экономика и метрики","Анализ рынка","Управление командой"],c:1,
why:"CAC - метрика юнит-экономики. Чтобы понять, что означает её рост и как это бьёт по модели монетизации, нужно знать, как устроены метрики и экономика продукта."},

{t:1,type:"single",q:"Продакт хочет выбить у CEO бюджет на исследование аудитории. CEO скептичен: «мы и так знаем своих пользователей». Какой soft skill нужен в первую очередь?",o:["Гибкость - согласиться и отложить","Коммуникации - объяснить ценность языком бизнеса и цифр","Самоорганизация - провести исследование без одобрения","Системное мышление - показать взаимосвязи в продукте"],c:1,
why:"Продакт влияет без прямых полномочий, его единственный инструмент - убеждение. А убеждение работает только на языке собеседника: с CEO это риски и деньги, а не продуктовые концепции."},

{t:1,type:"single",q:"Нужно зафиксировать требования к новой фиче после обсуждения с разработчиком. Какой инструмент подходит лучше всего?",o:["Голосовое сообщение в Telegram","Таск-менеджер","Почта с вложением","Комментарий к макету в Figma"],c:1,
why:"Таск-менеджер создан именно для этого: детали, статус, вложения, возможность вернуться в любой момент. В мессенджере договорённости теряются."},

{t:1,type:"single",q:"Команда договорилась изменить механику уведомлений. Что важнее всего включить в документ с решением?",o:["Список участников встречи и время","Дословный протокол обсуждения","Решение, контекст почему так решили и следующие шаги","Ссылки на все материалы"],c:2,
why:"Через полгода никто не помнит логику. Контекст решения избавляет команду от повторения тех же обсуждений, а следующие шаги переводят решение в действие."},

{t:1,type:"single",q:"Retention 7-го дня упал с 34% до 21% за две недели. Что это означает для продакта в первую очередь?",o:["Нужно срочно запустить рекламу и компенсировать потерю","Продукт плохой, надо переделывать","Есть проблема, её нужно локализовать: смотрим воронку и поведение","Это сезонность, ждём ещё две недели"],c:2,
why:"Резкое падение retention - сигнал к расследованию, а не к действию наугад. Первый шаг: понять, на каком именно шаге теряются пользователи."},

{t:1,type:"single",q:"Три фильтра жизнеспособной идеи:",o:["Боль реальная / есть доступ к аудитории / есть твой контекст","Рынок большой / конкурентов мало / технически просто","Идея нравится / коллеги просят / есть у конкурентов","Есть деньги / есть команда / есть время"],c:0,
why:"Боль должна быть настоящей, до аудитории нужно физически дойти для интервью, а без своего контекста ты задашь на интервью не те вопросы и не поймёшь ответы."},

{t:1,type:"single",q:"Идея: платформа для врачей по ведению электронных карт. Боль реальная, но автор не знает ни одного врача и не разбирается в медицине. Какой фильтр не пройден?",o:["Боль реальная","Доступ к аудитории и контекст","Боль и доступ к аудитории","Все три пройдены"],c:1,
why:"Не пройдены сразу два фильтра: нет доступа к респондентам и нет собственного контекста. Без этого качественные интервью не провести и ответы не интерпретировать."},

{t:1,type:"single",q:"«Нет удобного приложения для учёта личных финансов». Что не так с такой формулировкой проблемы?",o:["Слишком длинная формулировка","Это решение в формулировке проблемы, а не боль пользователя","Аудитория слишком узкая","Всё в порядке, нормальная проблема"],c:1,
why:"Ты уже решил, что нужно делать приложение, но не описал, что происходит с человеком прямо сейчас. Боль - это конкретная ситуация, а не отсутствие твоего продукта."},

{t:1,type:"multi",q:"Что из этого описано как боль, а не как пожелание?",o:["Человек тратит два часа в неделю на ручные сверки и путается в реквизитах","Пользователю было бы удобнее с тёмной темой","Человек не может планировать расходы, потому что не знает, дошли ли деньги","В приложении не хватает виджета на главный экран"],c:[0,2],
why:"Боль - это когда человек теряет время, деньги, испытывает тревогу или избегает ситуации. Удобство и недостающие фичи - пожелания: без них никто не страдает и не меняет поведение."},

{t:1,type:"single",q:"С какого блока Ash Maurya рекомендует начинать заполнение Lean Canvas?",o:["Решение","Ценностное предложение","Сегменты клиентов","Проблема"],c:2,
why:"Сначала - кто клиент. Ошибка в сегменте заставит переписать весь Canvas целиком."},

{t:1,type:"single",q:"Почему заполнение начинают именно с этого блока?",o:["Так проще технически","Всё остальное зависит от того, кто клиент: у разных сегментов разные проблемы, каналы и решения","Этот блок проще всего заполнить","Чтобы сразу оценить размер рынка"],c:1,
why:"Проблема, решение, каналы и UVP у разных сегментов различаются полностью. Пока не зафиксирован сегмент, всё остальное висит в воздухе."},

{t:1,type:"single",q:"«Люди, которые делают международные переводы» - что не так с таким описанием сегмента?",o:["Слишком мало людей в сегменте","Сегмент слишком широкий: у отправителей и получателей, физлиц и бизнеса разные боли","Не указан возраст и география","Описание корректное"],c:1,
why:"Фрилансер, ждущий оплату, мать, ждущая деньги от сына, и бизнес, платящий поставщику - это разные боли, разные альтернативы, разные каналы. Canvas для каждого будет свой."},

{t:1,type:"single",q:"Кто такие Early Adopters?",o:["Те, кто первыми установили приложение","Самые платёжеспособные клиенты","Те, у кого боль острее всех: уже ищут решение и готовы мириться с сыростью продукта","Массовая аудитория, раннее большинство"],c:2,
why:"Ранние последователи уже активно ищут решение своей проблемы, дают честную обратную связь и не ждут, пока продукт станет готовым. Именно на них проверяют гипотезы на старте."},

{t:1,type:"single",q:"В блоке Existing Alternatives написано: «альтернатив нет, рынок свободен». Что это означает?",o:["Хороший знак, рынок действительно свободен","Красный флаг: если люди ничем не обходятся, скорее всего боли нет либо плохо изучен рынок","Нейтрально, блок необязательный","Нормально для нового рынка"],c:1,
why:"Люди всегда находят способ справиться с острой проблемой: Excel, звонок, наличные, знакомый. Если альтернатив нет, значит проблема либо не настоящая, либо ты плохо посмотрел рынок."},

{t:1,type:"multi",q:"Какие из этого - типичные ошибки при написании UVP?",o:["Слишком общий: «удобный и быстрый сервис»","Описывает продукт или решение, а не ценность","Не связан ни с одной проблемой из блока Problem","В формулировке есть название продукта","Формулировка длиннее одного слова"],c:[0,1,2],
why:"Общая формулировка не даёт причины выбрать именно тебя, описание категории - это не обещание пользователю, а несвязанный с Problem UVP ломает связность Canvas."},

{t:1,type:"single",q:"Solution заполнен так: «Мобильное приложение с удобным интерфейсом, быстрыми переводами и низкой комиссией». Что не так?",o:["Слишком мало функций описано","Это описание продукта, а не ответы на три конкретные проблемы","Не указан технологический стек","Решение должно быть в блоке UVP"],c:1,
why:"Правило простое: одна проблема - одно решение. Каждая из трёх болей в блоке Problem должна получить конкретный ответ, а не общее описание продукта."},

{t:1,type:"single",q:"В каналы выписано восемь пунктов: Instagram, TikTok, YouTube, Telegram, контекст, SEO, партнёрства, рефералка. Почему это не стратегия?",o:["Не все каналы подходят для этой ниши","Работать со всеми одновременно невозможно: на старте берут один-два и проверяют","Не хватает офлайн-каналов","Всё нормально, каналы описаны корректно"],c:1,
why:"Восемь каналов - это отсутствие фокуса. Каждый требует бюджета, контента и внимания команды. Сначала проверяют один-два на этом сегменте, потом масштабируют."},

{t:1,type:"single",q:"Продукт на этапе MVP. Какая метрика лучше показывает, работает ли он?",o:["Количество установок приложения","Количество успешных целевых действий пользователя","Выручка за месяц","Все три одинаково важны"],c:1,
why:"Целевое действие - это цель пользователя. Если люди его совершают, продукт решает реальную задачу. Установки и выручка на MVP этого не показывают."},

{t:1,type:"single",q:"Точно посчитать доходы и расходы пока невозможно - слишком много неизвестных. Что делать с этими блоками Canvas?",o:["Оставить пустыми","Взять цифры конкурентов","Заполнить верхнеуровнево: модель монетизации и основные статьи затрат","Пропустить, это для финансистов"],c:2,
why:"Canvas - это гипотезы, а не финансовая модель. Записываешь, что знаешь; точные цифры появятся позже, после проверки гипотез."},

{t:1,type:"single",q:"Что из этого НЕ является Unfair Advantage?",o:["Сетевой эффект: 20 млн пользователей уже внутри","Опытная команда и хороший продукт","Данные как актив: 500 млн записей обучения для ML-моделей","Эксклюзивные договорённости с банками"],c:1,
why:"Нечестное преимущество - это то, что нельзя быстро скопировать или купить. Хорошая команда и качественный продукт есть у всех, кто в игре, это не преимущество."},

// ===================== ТЕМА 2 =====================
{t:2,type:"single",q:"Что такое рынок в продуктовом смысле?",o:["Все компании отрасли","Конкретные группы людей с задачей, их альтернативы и деньги, которые платятся за решение","Объём выручки отрасли за год","Площадка, на которой продаётся продукт"],c:1,
why:"Рынок - это не абстракция и не список компаний. Это сегменты, альтернативы и деньги. Выбор, который есть у пользователя, и есть рынок."},

{t:2,type:"single",q:"«Нужно, чтобы направление выросло по выручке на 30% за год». Какой это уровень цели?",o:["Цель бизнеса","Цель продукта","Цель исследования","Гипотеза"],c:0,
why:"Рост выручки и доли рынка - всегда цель бизнеса. Ниже неё идёт цель продукта (какое решение принять) и цель исследования (на какой вопрос ответить)."},

{t:2,type:"single",q:"«Понять, стоит ли усиливать направление переводов для фрилансеров». Какой это уровень цели?",o:["Цель бизнеса","Цель продукта","Цель исследования","Тренд"],c:1,
why:"Это уровень продуктового решения: вкладываться в направление или нет. Цель исследования была бы конкретнее - например, насколько велика ниша и что для неё важнее всего."},

{t:2,type:"single",q:"Какая формулировка - хорошая цель исследования?",o:["Разобраться в рынке финтеха Узбекистана","Собрать как можно больше данных об аудитории","Выяснить, какой долей переводов пользуются банки, а какой - небанковские сервисы","Сделать лучший сервис в нише"],c:2,
why:"Здесь ясно, что искать и когда работа закончена. Размытая цель приводит к ста вкладкам и нулю выводов."},

{t:2,type:"multi",q:"Какие пункты годятся для хорошего плана исследования?",o:["Сколько в стране людей с этой задачей","Изучить главных конкурентов","Какую комиссию берут основные способы решения","Что пользователи называют главной проблемой","Изучить тему переводов"],c:[0,2,3],
why:"Каждый пункт плана должен быть вопросом с ответом «да/нет» или числом. «Изучить конкурентов» и «изучить тему» - это темы, по ним нельзя понять, выполнен пункт или нет."},

{t:2,type:"single",q:"Опрос с вариантами ответов разослали 500 людям. Это количественный или качественный метод?",o:["Количественный, опросы всегда дают числа","Качественный, идёт общение с людьми","Зависит от формата вопросов: закрытые - количественный, открытые - качественный","Опрос - отдельная категория, ни то ни другое"],c:2,
why:"Опрос - это инструмент, а не категория. Один и тот же инструмент попадает в разные квадранты в зависимости от того, как его применяют."},

{t:2,type:"single",q:"Данные из готового отраслевого отчёта - это:",o:["Первичное количественное","Вторичное количественное","Первичное качественное","Вторичное качественное"],c:1,
why:"Вторичное - потому что данные собрал кто-то другой. Количественное - потому что даёт числа. Быстро и дёшево, но собиралось под чужие задачи."},

{t:2,type:"single",q:"У пользователей с включёнными push объём операций вдвое выше. Что из этого следует?",o:["Это причинно-следственная связь, push увеличивают активность","Это корреляция: направление связи неизвестно, нужен A/B тест","Данные ненадёжны, такого не бывает","Push нужно включить всем принудительно"],c:1,
why:"Возможно, наоборот: активные пользователи и так вовлечены во всё, поэтому и уведомления включают, и операций делают больше. Корреляция - только сигнал для гипотезы."},

{t:2,type:"single",q:"Единственный метод, который позволяет изолировать причину изменения метрики:",o:["Корреляционный анализ","Аналитика продукта","A/B эксперимент","Глубинное интервью"],c:2,
why:"В эксперименте меняется одна переменная и сравниваются тестовая и контрольная группы. Только так можно сказать «X вызывает Y», а не просто «X связан с Y»."},

{t:2,type:"multi",q:"Нужно понять, почему пользователи не возвращаются после первого использования. Какие методы подойдут?",o:["Глубинные интервью с теми, кто ушёл","A/B тест двух версий главного экрана","Разбор воронки: где обрываются сессии","Отраслевой отчёт о рынке за прошлый год","Опрос с открытым вопросом «почему не вернулись»"],c:[0,2,4],
why:"Интервью и открытый вопрос дадут причину, воронка покажет, на каком шаге происходит отток. A/B тест проверяет решение, а не ищет причину, а отчёт о рынке к этой задаче не относится."},

{t:2,type:"multi",q:"Какие два вопроса задают любому вторичному источнику до того, как на него опереться?",o:["Насколько свежие данные","Кто именно собирал и по какой методологии","Сколько источник стоит","Как часто на него ссылаются конкуренты"],c:[0,1],
why:"В быстрых отраслях трёхлетние цифры уже врут. А фраза «по данным исследования» без автора и даты - красный флаг."},

{t:2,type:"single",q:"Ключевой признак конкурента:",o:["Похожий функционал","Тот же технологический стек","Пользователь выбирает между вами в той же ситуации","Та же ценовая категория"],c:2,
why:"Дело не в похожести продуктов. Приложение, банковский перевод и крипта устроены совершенно по-разному, но если человек выбирает между ними в одной ситуации - все они конкуренты."},

{t:2,type:"single",q:"Фрилансер получает оплату через USDT p2p вместо твоего сервиса. Как это классифицировать?",o:["Ключевой конкурент","Косвенный конкурент-заместитель","Второстепенный конкурент","Не конкурент, это не приложение"],c:1,
why:"Заместитель - то, чем люди обходятся прямо сейчас, до того как узнали о твоём продукте. Задача та же, механизм принципиально другой."},

{t:2,type:"single",q:"Крупный банк-суперапп пока не в твоей нише, но технически может войти в неё в любой момент. Это конкурент:",o:["Ключевой","Прямой","Косвенный","Второстепенный"],c:3,
why:"Второстепенные - те, кто пока не в нише, но обладают ресурсами и инфраструктурой, чтобы зайти. Их держат в поле зрения, но не разбирают так глубоко, как ключевых."},

{t:2,type:"single",q:"Какой вопрос точнее всего указывает на твоего главного конкурента?",o:["У кого больше выручка","Кто чаще упоминается в СМИ","Как пользователь решает эту задачу прямо сейчас, без твоего продукта","У кого выше рейтинг в сторах"],c:2,
why:"Ответ на этот вопрос и есть главный конкурент. Часто это не приложение, а привычка: попросить знакомого, вести в Excel, обойтись наличными."},

{t:2,type:"single",q:"Собрали список из 35 игроков в нише. Какой критерий сократит его до 5-7 для детального разбора?",o:["Оставить тех, у кого высокий рейтинг в App Store","Оставить тех, кого пользователь реально рассматривает в момент выбора","Оставить только международных с большим бюджетом","Оставить все 35: больше данных - лучше анализ"],c:1,
why:"Критерий один - реальное присутствие в ситуации выбора пользователя. Если человек не рассматривает сервис, когда решает задачу, для анализа он нерелевантен."},

{t:2,type:"single",q:"Изучили конкурента: доля рынка 5%, рост 40% в год, активно продвигает мгновенное зачисление. Что важнее всего прямо сейчас?",o:["Доля 5%, конкурент небольшой, можно не беспокоиться","Рост 40%: он нашёл что-то работающее, надо понять что","Мгновенное зачисление, нужно срочно скопировать фичу","Все три показателя одинаково важны"],c:1,
why:"Быстрый рост означает, что конкурент нащупал рабочую связку - продукт, канал или позиционирование. Это сигнал разобраться, что именно, а не копировать первую заметную фичу."},

{t:2,type:"multi",q:"Какие блоки SWOT описывают внутреннюю среду?",o:["Strengths","Weaknesses","Opportunities","Threats"],c:[0,1],
why:"Сильные и слабые стороны - внутри компании. Возможности и угрозы - снаружи: рост рынка, регуляторика, новые игроки, кризис."},

{t:2,type:"single",q:"Откуда берутся критерии сравнения конкурентов?",o:["Из списка фич твоего продукта","Из фич конкурентов","Из задач и ситуаций пользователя","Из отраслевых отчётов"],c:2,
why:"Главный вопрос: что пользователь пытается сделать прямо сейчас и что ему мешает. Ответы на него и есть критерии - не «у нас есть Telegram-бот», а «человек не знает, что происходит с его заявкой»."},

{t:2,type:"multi",q:"Какие критерии пройдут оба теста: про результат для пользователя и важны вне зависимости от продукта?",o:["Деньги зачисляются в течение одного рабочего дня","Приложение работает на iOS и Android","Доход можно подтвердить документально для налоговой","Есть реферальная программа","Интерфейс доступен на русском языке"],c:[0,2],
why:"Скорость зачисления и возможность подтвердить доход - результаты, важные при любом способе решения задачи. Платформы, рефералка и язык интерфейса актуальны только если ты уже выбрал конкретный продукт."},

{t:2,type:"single",q:"При выбранных критериях твой продукт выигрывает по всем осям. Что это значит?",o:["Отлично, у продукта сильная позиция","Красный флаг: критерии подогнаны под твой продукт, их надо пересмотреть","Нормально, если критерии взяты от пользователя","Значит, конкурентов можно дальше не анализировать"],c:1,
why:"Такая матрица показывает что угодно, кроме реальной картины рынка. Критерии выбираются от пользователя, а не под сильные стороны своего продукта."},

{t:2,type:"single",q:"На какие три вопроса отвечает обоснование критерия?",o:["Что умеет продукт / сколько стоит / как реализовать","В какой ситуации пользователь / какой барьер мешает / как критерий снимает барьер","Кто конкурент / какая у него доля / как быстро растёт","Что за метрика / как считается / кто владелец"],c:1,
why:"Ситуация, барьер, снятие барьера. Без этой связки критерий выглядит как произвольный выбор, даже если он верный."},

{t:2,type:"single",q:"Регулятор ужесточил требования к идентификации пользователей финтех-приложений. К какой группе PEST это относится?",o:["Экономический","Политический","Технологический","Социальный"],c:1,
why:"Требование исходит от государственного регулятора и закрепляется в правилах. Технические доработки и расходы будут следствием, но первопричина в группе P."},

{t:2,type:"multi",q:"Какие факторы относятся к группе T (технологические)?",o:["Рост доли смартфонов среди людей старше 40 лет","Распространение NFC и бесконтактных платежей","Снижение реальных доходов из-за инфляции","Обязательная биометрическая идентификация в приложениях","Ослабление требований к хранению персональных данных за рубежом"],c:[1,3],
why:"NFC и биометрия - технологические решения, которые меняют сценарии и ожидания пользователя. Доходы - это E, требования к хранению данных - P, привычки и демография - S."},

{t:2,type:"single",q:"Несколько отзывов из одного канала просят голосовое управление. Почему это ещё не тренд?",o:["Голосовые интерфейсы плохо подходят для этой ниши","Один канал и небольшая группа - это сигнал; тренд подтверждают несколько независимых источников","Тренды определяют только аналитические агентства","Пользователи никогда не знают, чего хотят"],c:1,
why:"Тренд виден, когда несколько независимых источников указывают в одну сторону: поисковые запросы, поведение пользователей, шаги конкурентов. Пока этого нет - есть повод присмотреться."},

{t:2,type:"single",q:"Переход на мобильные платежи в стране идёт 5-7 лет и охватывает широкую аудиторию. Какой это масштаб тренда?",o:["Микротренд","Макротренд","Мегатренд","Это не тренд, а просто рост рынка"],c:1,
why:"Признаки макротренда: несколько лет, широкая аудитория, привязка к конкретной стране или региону. Мегатренды охватывают всю планету и длятся десятилетиями."},

{t:2,type:"single",q:"Два крупных конкурента объявили об обнулении комиссии. К какому типу относится это изменение?",o:["Рыночный тренд","Потребительский тренд","Не тренд, а разовое маркетинговое решение","Мегатренд"],c:0,
why:"Изменение на стороне предложения: игроки двигают цены и условия. Падение комиссий под давлением конкуренции - классический признак коммодитизации рынка."},

{t:2,type:"multi",q:"Какие наблюдения относятся к потребительским трендам (сторона спроса)?",o:["На рынок вышли два новых оператора","Пользователи всё чаще проверяют статус операции в реальном времени и жалуются, если его нет","Молодая аудитория ждёт персонализации","Средняя комиссия по рынку упала на 1,5 процентных пункта"],c:[1,2],
why:"Спрос - это поведение, привычки и ожидания пользователей. Новые игроки и движение цен - это сторона предложения, то есть рыночные тренды."},

{t:2,type:"single",q:"Тренд важен стратегически, но эффект растянут на годы и срочности нет. В какой квадрант он попадает?",o:["Действуй сейчас","Планируй","Наблюдай","Можно игнорировать"],c:1,
why:"Высокая важность плюс низкая срочность - «планируй»: тренд держат в стратегии и готовятся заранее, не бросая на него ресурсы прямо сейчас."},

{t:2,type:"single",q:"Что такое SOM?",o:["Весь объём рынка без ограничений","Часть TAM, которую продукт может обслужить по географии, каналу и сегменту","Часть SAM, которую реально занять за 1-3 года с учётом ресурсов и конкурентов","Выручка компании за прошлый год"],c:2,
why:"TAM задаёт масштаб возможности, SAM - стратегический ориентир, SOM - конкретный план на ближайшие годы. Именно SOM отвечает на вопрос «сколько вы реально заработаете»."},

{t:2,type:"single",q:"Три оси, по которым фиксируют границы рынка до расчёта:",o:["Продукт, география, сегмент","Цена, качество, скорость","TAM, SAM, SOM","Конкуренты, тренды, регуляторика"],c:0,
why:"Без этих трёх границ одно и то же число можно назвать и «весь финтех страны», и «переводы фрилансеров из одного города». Ошибка в границах не видна внутри самого расчёта."},

{t:2,type:"single",q:"TAM мобильного кредитования - 500 млрд сум/год. Работать планируют только в столице (30% рынка) и только с кредитами до 5 млн сум (40% объёма). Чему равен SAM?",o:["150 млрд сум","60 млрд сум","200 млрд сум","20 млрд сум"],c:1,
why:"SAM = 500 млрд × 30% × 40% = 60 млрд сум в год. Ограничения по географии и продукту перемножаются последовательно."},

{t:2,type:"single",q:"SAM составляет 60 млрд сум/год, реалистичная доля за первые два года - 3%. Чему равен SOM?",o:["1,8 млрд сум","180 млн сум","18 млрд сум","6 млрд сум"],c:0,
why:"SOM = 60 млрд × 3% = 1,8 млрд сум в год. Это и есть реалистичная цель, от которой дальше считают выручку с учётом маржи."},

{t:2,type:"single",q:"Top-down дал $18,9 млрд, bottom-up - $108 млн. Расхождение в 175 раз. Что произошло?",o:["Ошибка в арифметике одного из расчётов","Считали разные вещи: объём переводов против выручки с комиссии, метрики не приведены к одному знаменателю","Bottom-up всегда сильно занижает результат","Нужно взять среднее между двумя оценками"],c:1,
why:"Пока не договорился, что именно ты считаешь, числа сравнивать нельзя. Оба метода надо привести к одной метрике: либо оба в объёме рынка, либо оба в выручке."},

{t:2,type:"single",q:"Почему обоснованная оценка рынка важнее точной?",o:["Точных данных по рынку не бывает в принципе","Обоснованную можно проверить, оспорить и уточнить; псевдоточная цифра без методологии рассыпается при первом вопросе","Инвесторам всё равно, откуда числа","Точность важна только для SAM"],c:1,
why:"Прозрачная методология важнее красивой цифры. Скромная, но честная оценка вызывает у инвесторов больше доверия, чем большая и необоснованная."},

{t:2,type:"single",q:"Нужно понять, сколько людей потенциально могут стать пользователями продукта. Какой формат измерения ёмкости рынка нужен?",o:["В деньгах","В аудитории","В объёме транзакций","Все три одинаково подходят"],c:1,
why:"В аудитории: вся целевая группа минус нерелевантная доля. В деньгах считают, когда важен размер пирога, в транзакциях - когда планируют инфраструктуру."},

// ===================== СВЕРХ ПРОГРАММЫ =====================
{t:3,type:"single",q:"На интервью человек говорит: «да, я бы точно этим пользовался». Насколько сильный это сигнал?",o:["Сильный: прямое подтверждение спроса","Почти бесполезный: гипотетическое будущее поведение люди предсказывают плохо","Станет валидным, если уточнить цену","Достаточно пяти таких ответов, чтобы считать спрос подтверждённым"],c:1,
why:"Правило The Mom Test: спрашивай про прошлое, а не про будущее. «Расскажите, как вы решали это в последний раз», «сколько времени ушло», «что вы попробовали до этого». Комплименты и обещания - не данные."},

{t:3,type:"single",q:"Jobs to be Done в одном предложении - это:",o:["Список функций, которые хочет пользователь","Прогресс, которого человек добивается в конкретной ситуации; продукт «нанимают» для этой работы","Портрет пользователя с демографией и доходом","Сценарий прохождения интерфейса"],c:1,
why:"JTBD смещает фокус с «кто пользователь» на «в какой ситуации и ради какого прогресса он нанимает решение». Отсюда и определение конкурента: всё, что нанимают для той же работы, включая вариант «ничего не делать»."},

{t:3,type:"multi",q:"Какие описания сегмента построены по JTBD, а не по демографии или должности?",o:["HR-директор компании на 50-500 человек","Руководитель, которому нужно закрыть вакансию до конца квартала и не выйти за бюджет","Женщины 25-34 из крупных городов","Человек, который третий месяц не может решить, кого из своих повышать"],c:[1,3],
why:"Должность и демография описывают, кто человек. JTBD описывает ситуацию и прогресс - и именно из этого рождаются рабочие критерии выбора и сильный UVP."},

{t:3,type:"single",q:"Продукт отлично реализует «восхищающие» атрибуты по модели Кано, но проваливает базовые. Что будет?",o:["Пользователи простят недостатки ради вау-эффекта","Продукт будет отвергнут: отсутствие базовых атрибутов вызывает отторжение, а их наличие никого не радует","Модель Кано неприменима к цифровым продуктам","Базовые атрибуты можно спокойно добавить позже"],c:1,
why:"Кано делит атрибуты на обязательные, линейные и восхищающие. Обязательные не приносят удовлетворения, но их отсутствие убивает продукт. Сначала закрывают базу, потом играют в вау."},

{t:3,type:"single",q:"Какой сигнал ближе всего к настоящему product-market fit?",o:["Много установок после рекламной кампании","Пользователи возвращаются сами, кривая retention выходит на плато","Высокий NPS в опросе","Продукт привлёк инвестиционный раунд"],c:1,
why:"Плато на кривой удержания означает, что есть ядро, для которого продукт стал привычкой. Всё остальное можно купить за деньги или получить в опросе, а плато - нет."},

{t:3,type:"single",q:"Чем North Star Metric отличается от OMTM?",o:["Это одно и то же под разными названиями","NSM - долгосрочная метрика доставленной ценности, OMTM - одна метрика фокуса на текущем этапе","NSM для инвесторов, OMTM для команды разработки","OMTM - это всегда выручка"],c:1,
why:"NSM живёт годами и отражает момент, когда пользователь получает ценность. OMTM меняется от этапа к этапу: на MVP это одно число, на росте совершенно другое."},

{t:3,type:"single",q:"Почему выручка - плохой кандидат в North Star Metric?",o:["Её сложно корректно посчитать","Она отстающая и не отражает ценность для пользователя, команда не влияет на неё напрямую","Инвесторы и так видят её в отчётности","Она сильно зависит от курса валют"],c:1,
why:"Хорошая NSM опережающая: она меняется раньше денег и связана с моментом получения ценности. Выручка - следствие, по ней нельзя рулить командой в спринте."},

{t:3,type:"single",q:"Что означают буквы в RICE?",o:["Revenue, Impact, Cost, Effort","Reach, Impact, Confidence, Effort","Risk, Impact, Complexity, Estimate","Reach, Investment, Conversion, Effort"],c:1,
why:"RICE = (Reach × Impact × Confidence) / Effort. Confidence - честная поправка на то, насколько ты уверен в собственных оценках; без неё фреймворк превращается в способ обосновать заранее выбранное."},

{t:3,type:"single",q:"Bottom-up дал цифру больше, чем top-down. Что это чаще всего означает?",o:["Рынок недооценён отраслевыми отчётами","В bottom-up завышены допущения: частота, средний чек или размер аудитории","Нужно взять bottom-up, он всегда точнее","Методы несовместимы, сравнивать их нельзя"],c:1,
why:"Bottom-up легко раздувается: небольшая ошибка в частоте или чеке умножается на всю аудиторию. Расхождение - повод перепроверить допущения, а не выбрать цифру покрасивее."},

{t:3,type:"single",q:"Опрос запустили в своём Telegram-канале, 90% ответили «да, нужно». Что не так?",o:["Слишком мало респондентов","Выборка смещена: в канале сидят лояльные, они не представляют рынок","Опрос надо было делать с закрытыми вопросами","Ничего, 90% - убедительный результат"],c:1,
why:"Классическая ошибка выборки: те, до кого легче всего дотянуться, обычно самые лояльные. Чем проще было собрать респондентов, тем скептичнее стоит смотреть на результат."},

{t:3,type:"multi",q:"Какие вопросы на интервью наводящие и дадут мусорный ответ?",o:["Вам ведь неудобно вести это в Excel?","Расскажите, как вы делали это в последний раз","Вы бы платили за решение, которое сэкономит вам 5 часов в неделю?","Что вы пробовали, прежде чем остановиться на текущем способе?"],c:[0,2],
why:"Первый содержит желаемый ответ внутри вопроса, третий уводит в гипотетическое будущее и в цену, которую человек назовёт наугад. Рабочие вопросы всегда про конкретное прошлое поведение."},

{t:3,type:"single",q:"Почему switching cost критичен при анализе заместителей?",o:["Чем выше издержки перехода у конкурента, тем легче забрать его клиентов","Пока выигрыш не перекроет издержки перехода, пользователь не уйдёт, даже если твой продукт объективно лучше","Switching cost относится только к B2B","Это другое название стоимости подписки"],c:1,
why:"Издержки перехода - это время, перенос данных, переобучение команды, риск ошибки. Продукт должен быть не просто лучше, а заметно лучше, чтобы окупить их."},

{t:3,type:"single",q:"Чем сетевой эффект отличается от эффекта масштаба?",o:["Это синонимы","Сетевой эффект: ценность для пользователя растёт с числом пользователей. Эффект масштаба: падает себестоимость на единицу","Сетевой эффект бывает только у социальных сетей","Эффект масштаба работает только в офлайн-бизнесе"],c:1,
why:"Первый про ценность, второй про издержки. Сетевой эффект труднее скопировать деньгами, поэтому он чаще становится настоящим unfair advantage."},

{t:3,type:"single",q:"В B2B-продукте покупает HR-директор, работает в нём HR-менеджер, затронуты сотрудники. Как это отражать в Customer Segments?",o:["Писать только того, кто платит","Писать только того, кто пользуется","Развести роли: покупатель, пользователь и влияющие - у них разные боли и разные аргументы","Указать всех сотрудников компании"],c:2,
why:"В B2B покупатель и пользователь часто разные люди. Продукт продаётся первому, а живёт за счёт второго. Провал любой из ролей ломает сделку: не купят или купят и не будут пользоваться."},

{t:3,type:"single",q:"Что Джеффри Мур называет «пропастью» (chasm)?",o:["Разрыв между запуском и первой выручкой","Разрыв между ранними последователями и ранним большинством: им нужны принципиально разные аргументы","Разрыв между TAM и SAM","Период, когда заканчиваются инвестиции"],c:1,
why:"Визионеры покупают потенциал и мирятся с сыростью. Прагматики покупают готовое решение с референсами и гарантиями. Через пропасть не перепрыгнуть тем же продуктом и той же продажей."},

{t:3,type:"single",q:"Проверяешь спрос до разработки. Что даст самый сильный сигнал?",o:["20 интервью, где людям было интересно","Лендинг с ценой и предоплатой, которую кто-то реально внёс","Опрос на 500 человек","Подробный анализ конкурентов"],c:1,
why:"Сильнейший сигнал - когда человек чем-то жертвует: деньгами, временем, доступом к своим данным, репутацией внутри компании. Слова стоят дёшево, поэтому их и раздают щедро."},

{t:3,type:"single",q:"Каннибализация в продукте - это когда:",o:["Конкурент забирает твоих пользователей","Новый тариф или фича забирает выручку у твоего же существующего продукта","Пользователи уходят из-за роста цены","Продукт вытесняет заместителя с рынка"],c:1,
why:"Частая ловушка при запуске дешёвого тарифа: часть уже платящих просто мигрирует вниз, и суммарная выручка падает при формально выросшем числе клиентов."},

{t:3,type:"single",q:"Какая из этих метрик - vanity metric?",o:["Retention 30-го дня","Общее число зарегистрированных за всё время","Конверсия из регистрации в первое целевое действие","Доля пользователей, вернувшихся на 7-й день"],c:1,
why:"Накопительные метрики только растут и физически не умеют показать проблему. Полезная метрика обязана уметь падать - иначе по ней нельзя принимать решения."},

{t:3,type:"multi",q:"В каких случаях матрица сравнения конкурентов покажет неправду?",o:["Критерии взяты из списка фич твоего продукта","В строках нет заместителя","Оценки проставлены без того, чтобы самому попробовать продукты","В матрице пять конкурентов, а не десять"],c:[0,1,2],
why:"Полнота списка важна меньше всего. Матрица врёт из-за подогнанных критериев, отсутствия заместителя и оценок, проставленных по описаниям с сайтов вместо реального использования."},

{t:3,type:"single",q:"«Рынок 18 млрд, нам хватит занять 1%». Что не так с такой логикой?",o:["Ничего, 1% - скромная и реалистичная оценка","Это доля, взятая из воздуха: не показано, через какие каналы и с какой конверсией продукт получит этих клиентов","1% слишком мало, инвестор не заинтересуется","Нужно считать 3%, это стандарт"],c:1,
why:"Процент от большого числа не является планом. SOM должен собираться из каналов, конверсий и ресурсов команды - тогда его можно оспорить и уточнить, а не только принять на веру."},

{t:3,type:"single",q:"Регулятор объявил обсуждение новых требований к твоей отрасли. Как это правильно отразить?",o:["Как свершившийся факт, который меняет продуктовые планы","Как фактор высокой важности с неясной срочностью: зафиксировать и следить, пока это обсуждение, а не норма","Игнорировать до принятия закона","Отнести к технологическим факторам"],c:1,
why:"Обсуждение - не постановление. Важность высокая, срочность неясна: это «планируй» и «наблюдай», а не повод разворачивать роадмап под то, чего пока нет."},

// ---------------- state ----------------
let S={screen:"start",key:null,pool:[],idx:0,ans:{},sel:[],locked:false,label:""};
const app=document.getElementById('app'),bar=document.getElementById('bar'),barin=document.getElementById('barin');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const eq=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);

// ---------------- storage ----------------
const MEM={};
const CLOUD = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
let MODE='mem';

async function detectMode(){
  if(CLOUD){
    try{
      await window.storage.set('pm-probe','1');
      const r=await window.storage.get('pm-probe');
      if(r&&r.value==='1'){MODE='cloud';try{await window.storage.delete('pm-probe');}catch(e){}return;}
    }catch(e){}
  }
  try{
    localStorage.setItem('pm-probe','1');
    if(localStorage.getItem('pm-probe')==='1'){MODE='local';localStorage.removeItem('pm-probe');return;}
  }catch(e){}
  MODE='mem';
}

async function kvGet(k){
  if(MODE==='cloud'){try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){return null;}}
  if(MODE==='local'){try{return localStorage.getItem(k);}catch(e){return null;}}
  return MEM[k]||null;
}
async function kvSet(k,v){
  if(MODE==='cloud'){try{await window.storage.set(k,v);return;}catch(e){return;}}
  if(MODE==='local'){try{localStorage.setItem(k,v);return;}catch(e){return;}}
  MEM[k]=v;
}
async function kvDel(k){
  if(MODE==='cloud'){try{await window.storage.delete(k);}catch(e){}return;}
  if(MODE==='local'){try{localStorage.removeItem(k);}catch(e){}return;}
  delete MEM[k];
}

async function saveRun(){
  if(S.screen!=="quiz"||!S.key)return;
  const runs=await loadRuns();
  runs[S.key]={pool:S.pool,idx:S.idx,ans:S.ans,label:S.label};
  await kvSet('pm-quiz-runs',JSON.stringify(runs));
}
async function loadRuns(){const v=await kvGet('pm-quiz-runs');try{return v?JSON.parse(v):{};}catch(e){return {};}}
async function dropRun(key){
  if(!key)return;
  const runs=await loadRuns();delete runs[key];
  await kvSet('pm-quiz-runs',JSON.stringify(runs));
}
async function loadStats(){const v=await kvGet('pm-quiz-stats');try{return v?JSON.parse(v):{};}catch(e){return {};}}
async function noteStat(qi,ok){
  const st=await loadStats();st[qi]=ok?1:0;
  await kvSet('pm-quiz-stats',JSON.stringify(st));
}
async function resetAll(){await kvDel('pm-quiz-stats');await kvDel('pm-quiz-runs');}

// ---------------- start ----------------
async function exportCode(){
  const s=await loadStats(),r=await loadRuns();
  try{return btoa(unescape(encodeURIComponent(JSON.stringify({s,r}))));}catch(e){return "";}
}
async function importCode(code){
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!d||typeof d!=='object')return false;
    await kvSet('pm-quiz-stats',JSON.stringify(d.s||{}));
    await kvSet('pm-quiz-runs',JSON.stringify(d.r||{}));
    return true;
  }catch(e){return false;}
}

async function start(){
  S.screen="start";bar.style.display="none";
  const st=await loadStats(),runs=await loadRuns();
  const ids=f=>BANK.map((q,i)=>i).filter(i=>f==="all"||BANK[i].t==+f);

  const row=(f,n,title,sub)=>{
    const list=ids(f),total=list.length;
    const seen=list.filter(i=>st[i]!==undefined);
    const ok=seen.filter(i=>st[i]===1).length,no=seen.length-ok;
    const r=runs[f];
    const live=r&&r.pool&&r.idx<r.pool.length&&Object.keys(r.ans||{}).length>0;
    const line=live
      ? `<b>продолжить</b> · отвечено ${Object.keys(r.ans).length} из ${r.pool.length}`
      : seen.length
        ? `пройдено <b>${Math.round(seen.length/total*100)}%</b> · верно <b>${Math.round(ok/seen.length*100)}%</b> · ошибок <b>${no}</b>`
        : `ещё не проходил`;
    return `<div class="pick" role="button" tabindex="0" data-f="${f}">
      <span class="n">${n}</span>
      <span class="t">${title}${sub?`<em>${sub}</em>`:""}
        <span class="stat">
          <span class="sbar"><i class="ok" style="width:${ok/total*100}%"></i><i class="no" style="width:${no/total*100}%"></i></span>
          <span class="sline">${line}</span>
        </span>
      </span>
      <span class="right">
        <span class="c">${total}</span>
        ${live?`<button class="restart" data-r="${f}" title="Начать тему заново">↻</button>`:""}
      </span></div>`;
  };
  const dirty=Object.keys(st).length>0||Object.keys(runs).length>0;

  app.innerHTML=`
    <div class="hero fade">
      <div class="eyebrow">Junior Product Manager · Boostcamp</div>
      <h1 class="display">Темы 1 и 2<span>на проверку</span></h1>
      <p>Один вопрос за раз. Ответил - сразу видно, верно или нет, и почему. Каждая тема помнит, где ты остановился.</p>
    </div>
    <div class="picks fade">
      ${row("1","01","Продукт и бизнес-модель","")}
      ${row("2","02","Анализ рынка","")}
      ${row("3","+","Сверх программы","Те же темы, но глубже: JTBD, PMF, метрики, ловушки расчётов")}
      ${row("all","∑","Всё подряд","")}
    </div>
    ${dirty?`<button class="reset" id="rst">Сбросить весь прогресс</button>`:""}
    ${MODE==='mem'?`<div class="warn">
      <b>Здесь прогресс не сохранится</b>
      Браузер не даёт этой странице ничего записать. После закрытия всё сотрётся. Скачай файл и открой его в Chrome - там сохраняется. Либо перенеси прогресс кодом.
    </div>`:`<div class="where">${MODE==='cloud'?"Прогресс сохраняется в аккаунте Claude":"Прогресс сохраняется в этом браузере"}</div>`}
    <button class="reset" id="mig">Перенести прогресс между устройствами</button>
    <div class="migbox" id="migbox">
      <div class="migl">Твой код - скопируй его в том месте, где решал</div>
      <textarea id="out" readonly rows="3"></textarea>
      <button class="mini" id="copy">Скопировать</button>
      <div class="migl" style="margin-top:16px">Вставь сюда код с другого устройства</div>
      <textarea id="inp" rows="3" placeholder="вставь код"></textarea>
      <button class="mini" id="apply">Применить</button>
      <div class="migmsg" id="migmsg"></div>
    </div>`;

  app.querySelectorAll('.pick').forEach(b=>{
    const go=()=>begin(b.dataset.f,ids(b.dataset.f),{1:"Тема 1",2:"Тема 2",3:"Сверх программы",all:"Всё подряд"}[b.dataset.f]);
    b.onclick=go;
    b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
  app.querySelectorAll('.restart').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    await dropRun(b.dataset.r);
    start();
  });
  const rst=document.getElementById('rst');
  if(rst)rst.onclick=async()=>{await resetAll();start();};

  const mig=document.getElementById('mig'),box=document.getElementById('migbox');
  mig.onclick=async()=>{
    box.classList.toggle('open');
    if(box.classList.contains('open'))document.getElementById('out').value=await exportCode();
  };
  document.getElementById('copy').onclick=()=>{
    const ta=document.getElementById('out');
    ta.select();ta.setSelectionRange(0,99999);
    try{navigator.clipboard.writeText(ta.value);}catch(e){try{document.execCommand('copy');}catch(e2){}}
    document.getElementById('migmsg').textContent="Код скопирован";
  };
  document.getElementById('apply').onclick=async()=>{
    const v=document.getElementById('inp').value;
    if(!v.trim()){document.getElementById('migmsg').textContent="Поле пустое";return;}
    const ok=await importCode(v);
    if(ok)start();else document.getElementById('migmsg').textContent="Код не распознан";
  };
}

async function begin(key,pool,label,fresh){
  let r=null;
  if(key&&!fresh){const runs=await loadRuns();r=runs[key];}
  if(r&&r.pool&&r.pool.length&&r.idx<r.pool.length){
    S={screen:"quiz",key,pool:r.pool,idx:r.idx,ans:r.ans||{},sel:[],locked:false,label:r.label||label};
  }else{
    S={screen:"quiz",key,pool,idx:0,ans:{},sel:[],locked:false,label};
  }
  render();
}

// ---------------- ribbon ----------------
function ribbon(){
  const ticks=S.pool.map((qi,i)=>{
    const a=S.ans[qi];
    let cl=a?(a.ok?"tick ok":"tick no"):"tick";
    if(i===S.idx&&S.screen==="quiz")cl="tick now";
    return `<div class="${cl}"></div>`;
  }).join('');
  const done=Object.keys(S.ans).length;
  const right=Object.values(S.ans).filter(a=>a.ok).length;
  return `<div class="ribbon-hold">
    <button class="back" id="back">← В меню</button>
    <div class="ribbon">${ticks}</div>
    <div class="ribbon-meta"><span>${esc(S.label)}</span><span><b>${right}</b> из ${done||0} верно</span></div></div>`;
}

function wireBack(){
  const b=document.getElementById('back');
  if(b)b.onclick=async()=>{await saveRun();bar.style.display="none";start();};
}

// ---------------- question ----------------
function render(){
  const qi=S.pool[S.idx],q=BANK[qi];
  const prev=S.ans[qi];
  if(prev&&!S.locked){S.sel=prev.sel;S.locked=true;}

  const opts=q.o.map((text,i)=>{
    let cl="opt",mark="";
    if(S.locked){
      const isC=q.type==="multi"?q.c.includes(i):q.c===i;
      const isS=S.sel.includes(i);
      if(isC){cl+=" ok";mark="✓";}
      else if(isS){cl+=" no";mark="✕";}
      else cl+=" dim";
    }else if(S.sel.includes(i)){cl+=" sel";mark=q.type==="multi"?"✓":"●";}
    return `<button class="${cl}" data-i="${i}" ${S.locked?"disabled":""}>
      <span class="box">${mark}</span><span>${esc(text)}</span></button>`;
  }).join('');

  let verdict="";
  if(S.locked){
    const ok=S.ans[qi].ok;
    verdict=`<div class="verdict ${ok?'ok':'no'} fade">
      <span class="lab">${ok?"Верно":"Мимо"}</span>${esc(q.why)}</div>`;
  }

  app.innerHTML=ribbon()+`
    <div class="qhead">
      <div class="qnum">${q.t===3?"СВЕРХ ПРОГРАММЫ":"ТЕМА "+q.t} · ВОПРОС ${S.idx+1}/${S.pool.length}</div>
      <div class="qtext">${esc(q.q)}</div>
      ${q.type==="multi"?`<div class="qhint">Несколько вариантов</div>`:""}
    </div>
    <div class="opts">${opts}</div>
    ${verdict}`;

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  wireBack();
  bar.style.display="block";
  drawBar();
  window.scrollTo({top:0,behavior:"instant"});
}

function pick(i){
  const qi=S.pool[S.idx],q=BANK[qi];
  if(S.locked)return;
  if(q.type==="multi"){
    S.sel=S.sel.includes(i)?S.sel.filter(x=>x!==i):[...S.sel,i];
    render();
  }else{
    S.sel=[i];
    lock();
  }
}

function lock(){
  const qi=S.pool[S.idx],q=BANK[qi];
  const ok=q.type==="multi"?eq(S.sel,q.c):S.sel[0]===q.c;
  S.ans[qi]={sel:[...S.sel],ok};
  S.locked=true;
  saveRun();
  noteStat(qi,ok);
  render();
}

function drawBar(){
  const qi=S.pool[S.idx],q=BANK[qi];
  if(!S.locked&&q.type==="multi"){
    barin.innerHTML=`<button class="go" id="chk" ${S.sel.length?"":"disabled"}>Проверить</button>`;
    document.getElementById('chk').onclick=lock;
  }else if(S.locked){
    const last=S.idx===S.pool.length-1;
    barin.innerHTML=`<button class="go ${last?'dark':''}" id="nx">${last?"Показать итоги":"Дальше"}</button>`;
    document.getElementById('nx').onclick=()=>{
      if(last){finish();}
      else{S.idx++;S.sel=[];S.locked=false;saveRun();render();}
    };
  }else{
    barin.innerHTML=`<button class="go" disabled>Выбери ответ</button>`;
  }
}

// ---------------- result ----------------
async function finish(){
  await dropRun(S.key);
  S.screen="done";
  const wrong=S.pool.filter(qi=>!S.ans[qi].ok);
  const right=S.pool.filter(qi=>S.ans[qi].ok);
  const pct=Math.round(right.length/S.pool.length*100);
  const verdictLine=pct===100?"Всё чисто.":pct>=85?"Крепко. Разобрать пару мест - и можно на воркшоп.":pct>=60?"База есть, но провалы заметные.":"Стоит перечитать теорию, а потом прогнать ещё раз.";

  const card=qi=>{
    const q=BANK[qi],a=S.ans[qi];
    const mine=a.sel.length?a.sel.map(i=>q.o[i]).join(" · "):"нет ответа";
    const corr=(q.type==="multi"?q.c:[q.c]).map(i=>q.o[i]).join(" · ");
    return `<div class="item" data-q="${qi}">
      <button class="item-top">
        <span class="mark ${a.ok?'ok':'no'}">${a.ok?'✓':'✕'}</span>
        <span class="qt">${esc(q.q)}</span>
        <span class="chev">▾</span>
      </button>
      <div class="item-body">
        ${a.ok?"":`<div class="row bad"><div class="k">Твой ответ</div><div class="v">${esc(mine)}</div></div>`}
        <div class="row good"><div class="k">Верно</div><div class="v">${esc(corr)}</div></div>
        <div class="why">${esc(q.why)}</div>
      </div></div>`;
  };

  app.innerHTML=ribbon()+`
    <div class="score fade">
      <div class="big" style="color:${pct>=85?'var(--ok)':pct>=60?'var(--blue)':'var(--no)'}">${right.length}</div>
      <div class="of">из ${S.pool.length} верных ответов</div>
      <div class="pct">${pct}% · ${esc(verdictLine)}</div>
    </div>
    <div class="grouphead"><h2>Перечитать</h2><span class="cnt no">${wrong.length}</span></div>
    ${wrong.length?wrong.map(card).join(''):`<div class="empty">Пусто - ни одной ошибки.</div>`}
    <div class="grouphead"><h2>Усвоено</h2><span class="cnt ok">${right.length}</span></div>
    ${right.length?right.map(card).join(''):`<div class="empty">Пока ничего.</div>`}
    <div class="endbtns">
      ${wrong.length?`<button class="go" id="again">Прорешать только ошибки</button>`:""}
      <button class="go dark" id="home">Вернуться к выбору темы</button>
    </div>`;

  app.querySelectorAll('.item-top').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  wireBack();
  const ag=document.getElementById('again');
  if(ag)ag.onclick=()=>begin(null,wrong,S.label+" · работа над ошибками",true);
  document.getElementById('home').onclick=()=>start();
  bar.style.display="none";
  window.scrollTo({top:0,behavior:"instant"});
}

(async()=>{await detectMode();start();})();
</script>
